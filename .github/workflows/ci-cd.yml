name: UrjaSathi CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# ==========================================
# CI
# ==========================================

jobs:

  test:

    name: Automated Checks

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------
      # Checkout
      # --------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4


      # --------------------------------------
      # Frontend
      # --------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci


      - name: Build frontend
        working-directory: frontend
        run: npm run build


      # --------------------------------------
      # Backend
      # --------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Check Python syntax
        run: |
          python -m compileall backend


      # --------------------------------------
      # Docker
      # --------------------------------------

      - name: Build frontend Docker image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t urjasathi-frontend:test \
            .


      - name: Build backend Docker image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t urjasathi-backend:test \
            .


# ==========================================
# BUILD + PUSH
# ==========================================

  build-and-push:

    name: Build and Push Images

    needs: test

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    # Use the GitHub Environment containing
    # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
    environment: DOCKERHUB_USERNAME

    steps:

      # --------------------------------------
      # Checkout
      # --------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4


      # --------------------------------------
      # Set image tag
      # --------------------------------------

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

          echo "Image tag: ${GITHUB_SHA}"


      # --------------------------------------
      # Login to DockerHub
      # --------------------------------------

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # --------------------------------------
      # Frontend
      # --------------------------------------

      - name: Build frontend image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/urjasathi-frontend:${IMAGE_TAG} \
            .


      - name: Push frontend image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/urjasathi-frontend:${IMAGE_TAG}


      # --------------------------------------
      # Backend
      # --------------------------------------

      - name: Build backend image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/urjasathi-backend:${IMAGE_TAG} \
            .


      - name: Push backend image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/urjasathi-backend:${IMAGE_TAG}


# ==========================================
# DEPLOY THROUGH AWS SSM
# ==========================================

  deploy:

    name: Deploy to EC2

    needs: build-and-push

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      # --------------------------------------
      # AWS OIDC authentication
      # --------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}


      # --------------------------------------
      # Deploy using AWS SSM
      # --------------------------------------

      - name: Deploy containers through SSM
        run: |

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy UrjaSathi ${GITHUB_SHA}" \
            --parameters commands='[
              "cd /opt/urjasathi",
              "export IMAGE_TAG='${GITHUB_SHA}'",
              "docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml pull",
              "docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml up -d",
              "docker image prune -f",
              "sleep 10",
              "curl --fail http://localhost/api/health"
            ]' \
            --query "Command.CommandId" \
            --output text)


          echo "SSM Command ID: $COMMAND_ID"


          # --------------------------------------
          # Wait for SSM command
          # --------------------------------------

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"


          # --------------------------------------
          # Check deployment status
          # --------------------------------------

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)


          echo "Deployment status: $STATUS"


          # --------------------------------------
          # Fail workflow if deployment failed
          # --------------------------------------

          if [ "$STATUS" != "Success" ]; then

            echo "Deployment failed."

            echo "========== SSM OUTPUT =========="

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

            exit 1

          fi


          echo "======================================"
          echo "UrjaSathi deployment successful!"
          echo "Commit: ${GITHUB_SHA}"
          echo "======================================"